name: Verificar jardín
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sitio:
        description: URL pública de este jardín en Vercel (opcional)
        required: false
        type: string
permissions:
  contents: read
jobs:
  navegador:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          JARDIN_URL: ${{ inputs.sitio }}
